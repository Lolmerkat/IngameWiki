plugins {
	alias(libs.plugins.loom)
}

base {
	archivesName = 'ingamewiki'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	mods {
		"ingamewiki" {
			sourceSet sourceSets.main
		}
	}
}

// In-game test: ./gradlew runClientGameTest starts the client, changes a setting in the config screen and looks up an
// inventory item on the wiki (needs internet). Screenshots go to build/run/clientGameTest/screenshots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "ingamewiki-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft libs.minecraft
	implementation libs.fabric.loader
	implementation libs.fabric.api

	// Shared library, bundled into the mod jar (Fabric Loader picks the newest copy if several mods bundle it).
	implementation libs.qollib
	include libs.qollib

	// HTML parser for the in-game renderer, bundled into the mod jar.
	include(implementation("org.jsoup:jsoup:${project.jsoup_version}"))

	// Optional: adds a config button to the Mod Menu mod list.
	compileOnly(libs.modmenu) { transitive = false }
	localRuntime(libs.modmenu) { transitive = false }

	// Optional: MCEF Modern provides the embedded Chromium browser for the "MCEF" open mode.
	compileOnly("maven.modrinth:mcef-modern:${project.mcef_modern_version}") { transitive = false }
	compileOnly("me.friwi:jcef-api:${project.jcef_api_version}") { transitive = false }
	// MCEF downloads Chromium (~150 MB) on first use, so it is only added to the dev client on request:
	// ./gradlew runClient -Pmcef
	if (project.hasProperty('mcef')) {
		localRuntime("maven.modrinth:mcef-modern:${project.mcef_modern_version}") { transitive = false }
	}

	testImplementation platform(libs.junit.bom)
	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.launcher
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}
