name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QOLLib (the shared library and the version catalog) is built from source next to the mod.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/QOLLib
          path: QOLLib

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -Pqollib.dir=QOLLib

      - uses: actions/upload-artifact@v4
        with:
          name: ingamewiki
          path: build/libs/*.jar
